<div class="form-group {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
