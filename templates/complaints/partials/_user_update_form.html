{% if complaint.status != 'RESOLVED' %}
<h2>Add information</h2>

<form method="post" action="{% url 'complaints:add_info' complaint.complaint_id %}" data-once>
    {% csrf_token %}

    <div class="form-group">
        <label for="note">
            Additional information <span class="required">*</span>
        </label>

        <textarea
            id="note"
            name="note"
            rows="4"
            required
        ></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Add information
    </button>
</form>
{% endif %}
